name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: 📱 بناء تطبيق أندرويد (APK)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 استرجاع الكود من المستودع
        uses: actions/checkout@v4

      - name: ⚙️ إعداد بيئة Node.js (v22 LTS المطلوبة لـ Capacitor 7)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ☕ إعداد بيئة Java (v21 LTS)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 🤖 قبول رخص Android SDK
        run: |
          yes | sdkmanager --licenses || true

      - name: 📦 تثبيت حزم المشروع
        run: npm install --legacy-peer-deps

      - name: 🏗️ بناء واجهة الويب (Vite Build)
        run: npm run build

      - name: 📱 مزامنة أندرويد مع الكاباسيتور
        run: |
          if [ ! -d "android" ]; then
            echo "تهيئة منصة أندرويد..."
            npx cap add android
          fi
          npx cap sync android

      - name: 🛠️ تجهيز صلاحيات ملف Gradle
        run: |
          chmod +x android/gradlew

      - name: 🔨 تجميع وبناء ملف الـ APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 🔍 التحقق من وجود ملف الـ APK
        id: find-apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "لم يتم العثور على ملف APK!"
            exit 1
          fi
          echo "تم العثور على APK في: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: 📤 رفع ملف الـ APK للتنزيل المباشر (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Azizi-POS-Android-App
          path: ${{ steps.find-apk.outputs.apk_path }}
          retention-days: 30

      - name: 📝 ملخص البناء والتعليمات
        if: always()
        run: |
          echo "### 🎉 تم بناء تطبيق أندرويد بنجاح!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "يمكنك تحميل ملف الـ APK الآن من قسم **Artifacts** في أسفل صفحة هذا البناء على GitHub Actions." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **اسم التطبيق:** بقالة العزي - نظام الفواتير" >> $GITHUB_STEP_SUMMARY
          echo "- **النوع:** Android APK (Debug)" >> $GITHUB_STEP_SUMMARY
          echo "- **جاهز للتثبيت على الهواتف والأجهزة اللوحية.**" >> $GITHUB_STEP_SUMMARY
